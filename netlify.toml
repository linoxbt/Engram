# Netlify: Next.js on the OpenNext runtime, pnpm workspace. The runtime plugin is
# declared explicitly because upload-triggered builds don't auto-install it.
[build]
  base = "apps/web"
  # `provision` is a no-op unless ENGRAM_PROVISION is set (see scripts/provision.ts).
  command = "pnpm -C ../.. run provision && pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
